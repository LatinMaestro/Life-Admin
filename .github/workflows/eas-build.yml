name: EAS client candidate builds

on:
  push:
    branches:
      - release/client-candidate-builds

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Android preview
            platform: android
            profile: preview
          - label: iOS simulator
            platform: ios
            profile: simulator
    steps:
      - name: Require Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is required."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Verify live release configuration
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://lifeadmin.grovekind.com
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsubGlmZWFkbWluLmdyb3Zla2luZC5jb20k
        run: npm run release:check:live

      - name: Verify EAS project
        working-directory: mobile
        run: eas project:info

      - name: Start cloud build
        working-directory: mobile
        run: eas build --platform "${{ matrix.platform }}" --profile "${{ matrix.profile }}" --non-interactive --no-wait
