name: Prepare production activation batch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'production-activation-readiness'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply production activation batch
        shell: bash
        run: |
          mkdir -p '.'
          printf '%s' '' | base64 --decode > 'package.json'
          mkdir -p 'src/lib/server'
          printf '%s' '' | base64 --decode > 'src/lib/server/prisma.ts'
          mkdir -p 'src/lib/auth'
          printf '%s' '' | base64 --decode > 'src/lib/auth/clerk-session.ts'
          mkdir -p 'src/lib/server'
          printf '%s' '' | base64 --decode > 'src/lib/server/household-access.ts'
          mkdir -p 'src/lib/persistence'
          printf '%s' '' | base64 --decode > 'src/lib/persistence/prisma-adapter.ts'
          mkdir -p 'scripts'
          printf '%s' '' | base64 --decode > 'scripts/check-production-activation.mjs'
          mkdir -p 'scripts'
          printf '%s' '' | base64 --decode > 'scripts/seed-initial-household.mjs'
          mkdir -p '.'
          printf '%s' '' | base64 --decode > '.env.example'
          mkdir -p '.github/workflows'
          printf '%s' '' | base64 --decode > '.github/workflows/ci.yml'
          mkdir -p 'docs'
          printf '%s' '' | base64 --decode > 'docs/PRODUCTION_ACTIVATION_RUNBOOK.md'
          mkdir -p '.'
          printf '%s' '' | base64 --decode > 'PLAN.md'
          mkdir -p '.'
          printf '%s' '' | base64 --decode > 'README.md'
          mkdir -p 'docs'
          printf '%s' '' | base64 --decode > 'docs/PERSISTENCE_MIGRATION_PLAN.md'
          mkdir -p 'docs'
          printf '%s' '' | base64 --decode > 'docs/AUTH_SESSION_DESIGN.md'
          mkdir -p 'docs'
          printf '%s' '' | base64 --decode > 'docs/AUTHENTICATION_PROVIDER_DECISION.md'
          mkdir -p 'docs'
          printf '%s' '' | base64 --decode > 'docs/DATA_MODEL.md'
          mkdir -p 'docs'
          printf '%s' '' | base64 --decode > 'docs/REVIEW_GATES.md'

      - name: Refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Verify prepared batch
        run: |
          pnpm lint
          pnpm guardrails:payment-source
          pnpm guardrails:static-data-boundary
          pnpm guardrails:migration
          pnpm check:activation
          DATABASE_URL=postgresql://user:password@localhost:5432/family_life_admin?schema=public pnpm db:validate
          DATABASE_URL=postgresql://user:password@localhost:5432/family_life_admin?schema=public pnpm db:generate
          pnpm typecheck
          pnpm build

      - name: Commit prepared batch
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-production-activation.yml
          git add -A
          git commit -m "Prepare production activation controls"
          git push origin "HEAD:${BRANCH_NAME}"
