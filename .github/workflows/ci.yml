name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Web quality and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check payment source guardrails
        run: pnpm guardrails:payment-source

      - name: Check static data boundaries
        run: pnpm guardrails:static-data-boundary

      - name: Check mobile API boundaries
        run: pnpm guardrails:mobile-api

      - name: Check initial migration
        run: pnpm guardrails:migration

      - name: Check recurrence migration
        run: pnpm guardrails:recurrence-migration

      - name: Test recurrence engine
        run: pnpm test:recurrence

      - name: Check source asset migration
        run: pnpm guardrails:source-asset-migration

      - name: Test source file policy
        run: pnpm test:source-files

      - name: Check email intake migration
        run: pnpm guardrails:email-intake-migration

      - name: Test email intake signatures
        run: pnpm test:email-intake

      - name: Check safe intake migration
        run: pnpm guardrails:safe-intake-migration

      - name: Test safe intake policy
        run: pnpm test:intake-policy

      - name: Check voice migration
        run: pnpm guardrails:voice-migration

      - name: Check private notification migration
        run: pnpm guardrails:notification-migration

      - name: Test private notification policy
        run: pnpm test:notifications

      - name: Test operations scheduler contract
        run: pnpm test:operations-scheduler

      - name: Test security boundaries
        run: pnpm test:security-boundaries

      - name: Check private lifecycle recovery
        run: pnpm guardrails:private-lifecycle

      - name: Check production migration baseline coverage
        run: pnpm guardrails:production-baseline

      - name: Validate Prisma schema
        run: pnpm db:validate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/family_life_admin?schema=public

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/family_life_admin?schema=public

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install Chromium test runtime
        run: |
          npm install --prefix /tmp/life-admin-playwright playwright@1.56.1
          node /tmp/life-admin-playwright/node_modules/playwright/cli.js install --with-deps chromium

      - name: Start production build
        run: |
          pnpm start > /tmp/life-admin-next.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/life-admin-next.log
          exit 1

      - name: Run responsive browser journeys
        run: node scripts/e2e-release-smoke.cjs
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          NODE_PATH: /tmp/life-admin-playwright/node_modules

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-screenshots
          path: test-results/release-smoke
          if-no-files-found: warn
          retention-days: 14

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Check store configuration
        run: npm run release:check

      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir dist-ios
        env:
          EXPO_PUBLIC_API_URL: https://lifeadmin.grovekind.com
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZmFrZS5jbGVyay5hY2NvdW50JA

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist-android
        env:
          EXPO_PUBLIC_API_URL: https://lifeadmin.grovekind.com
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZmFrZS5jbGVyay5hY2NvdW50JA
