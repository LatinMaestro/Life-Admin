name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, guardrails, Prisma validate, generate, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check payment source guardrails
        run: pnpm guardrails:payment-source

      - name: Check static data boundaries
        run: pnpm guardrails:static-data-boundary

      - name: Check initial migration
        run: pnpm guardrails:migration

      - name: Validate Prisma schema
        run: pnpm db:validate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/family_life_admin?schema=public

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/family_life_admin?schema=public

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
