name: Initialize Expo project

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/eas-init.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    name: Link EAS project
    runs-on: ubuntu-latest
    steps:
      - name: Check Expo token
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured yet; Expo linking is deferred."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release branch
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          ref: release/mobile-eas-link

      - name: Set up Node.js
        if: steps.token.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Expo and EAS
        if: steps.token.outputs.available == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile dependencies
        if: steps.token.outputs.available == 'true'
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Create or link EAS project
        if: steps.token.outputs.available == 'true'
        working-directory: mobile
        run: |
          eas whoami
          eas project:init --non-interactive --force
          eas project:info

      - name: Configure EAS release environments
        if: steps.token.outputs.available == 'true'
        working-directory: mobile
        run: |
          for environment in preview production; do
            eas env:create --name EXPO_PUBLIC_API_URL --value https://lifeadmin.grovekind.com --environment "$environment" --visibility plaintext --force --non-interactive
            eas env:create --name EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY --value pk_live_Y2xlcmsubGlmZWFkbWluLmdyb3Zla2luZC5jb20k --environment "$environment" --visibility plaintext --force --non-interactive
          done
          eas env:list --environment production

      - name: Run live mobile release gate
        if: steps.token.outputs.available == 'true'
        working-directory: mobile
        run: eas env:exec production "npm run release:check:live" --non-interactive

      - name: Commit generated project link
        if: steps.token.outputs.available == 'true'
        run: |
          if git diff --quiet -- mobile/app.json; then
            echo "Expo project was already linked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/app.json
          git commit -m "chore(mobile): link Expo EAS project"
          git push origin HEAD:release/mobile-eas-link
